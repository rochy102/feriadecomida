<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhesiones Feria Comida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Overlay de Login (Administrador) -->
    <div id="loginOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center border-t-4 border-green-600">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center text-green-600 mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Acceso Administrador</h2>
            <input type="password" id="adminPassword" placeholder="Contraseña" class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-green-600 outline-none">
            <div class="flex gap-2">
                <button onclick="closeLoginModal()" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-lg font-bold">Volver</button>
                <button onclick="checkLogin()" class="w-2/3 bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold">Ingresar</button>
            </div>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden font-medium">Contraseña incorrecta</p>
        </div>
    </div>

    <!-- Modal de Configuración -->
    <div id="configOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-[100] hidden items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-lg w-full border-t-4 border-blue-600 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Configuración</h2>
                <button onclick="closeConfigModal()" class="text-gray-400">✕</button>
            </div>
            <div class="space-y-4">
                <label class="block text-sm font-medium text-gray-700">Plato</label>
                <input type="text" id="cfgPlato" class="w-full px-4 py-2 border rounded-lg">
                <label class="block text-sm font-medium text-gray-700">Grado</label>
                <input type="text" id="cfgGrado" class="w-full px-4 py-2 border rounded-lg">
                <label class="block text-sm font-medium text-gray-700">URL Web App Sheets</label>
                <input type="text" id="cfgSheetsUrl" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="closeConfigModal()" class="w-1/3 bg-gray-100 py-3 rounded-lg font-bold">Cancelar</button>
                <button onclick="saveEventConfig()" class="w-2/3 bg-blue-600 text-white py-3 rounded-lg font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="flex flex-col min-h-screen w-full">
        <header class="bg-white shadow-sm border-b-4 border-green-600">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Adhesiones <span id="headerGrado" class="text-green-600"></span></h1>
                <button onclick="showLoginModal()" class="text-gray-400 hover:text-gray-600">⚙️</button>
            </div>
        </header>

        <nav class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 flex gap-6">
                <button onclick="switchTab('ventas')" id="tabBtn-ventas" class="py-3 border-b-2 border-green-600 font-bold text-green-700">Ventas</button>
                <button onclick="switchTab('dashboard')" id="tabBtn-dashboard" class="py-3 border-b-2 border-transparent font-medium text-gray-500">Dashboard</button>
            </div>
        </nav>

        <main id="ventasContainer" class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full flex flex-col md:flex-row gap-8">
            <div class="w-full md:w-1/3">
                <div class="bg-white rounded-xl shadow-sm border p-6">
                    <h2 class="font-bold mb-4">Registrar Venta</h2>
                    <form id="adhesionForm" class="space-y-4">
                        <input type="text" id="vendedor" placeholder="Vendedor" required class="w-full px-4 py-2 border rounded-lg">
                        <input type="number" id="precio" placeholder="Precio" required class="w-full px-4 py-2 border rounded-lg">
                        <input type="text" id="comprador" placeholder="Retira" class="w-full px-4 py-2 border rounded-lg">
                        <div class="flex gap-4">
                            <label><input type="radio" name="estadoPago" value="pagado" checked> Pagado</label>
                            <label><input type="radio" name="estadoPago" value="pendiente"> Pendiente</label>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg">Registrar</button>
                    </form>
                </div>
            </div>
            <div class="w-full md:w-2/3">
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="px-6 py-3">Nº</th>
                                <th class="px-6 py-3">Vendedor</th>
                                <th class="px-6 py-3">Estado</th>
                                <th class="px-6 py-3">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <main id="dashboardContainer" class="hidden flex-grow max-w-7xl mx-auto px-4 py-8 w-full flex-col">
            <h2 class="text-2xl font-bold mb-6">Finanzas</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl border">
                    <p class="text-sm font-bold text-gray-500 uppercase">Total Cobrado</p>
                    <p id="dash-pagado" class="text-4xl font-black mt-2">Gs. 0</p>
                </div>
                <div class="bg-white p-6 rounded-xl border">
                    <p class="text-sm font-bold text-gray-500 uppercase">Total Pendiente</p>
                    <p id="dash-pendiente" class="text-4xl font-black mt-2">Gs. 0</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        let eventConfig = JSON.parse(localStorage.getItem('feriaEventConfig')) || { sheetsUrl: 'https://script.google.com/macros/s/AKfycbzNpoTs3A_USns_Ny40Ql7ZNc3fdOVcWz1WQ8bVsvzmmzqLoLB7CtWtzxO3Uka-J8nw/exec' };
        let adhesiones = [];

        function showToast(m) { const t = document.createElement('div'); t.className = 'bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg'; t.textContent = m; document.getElementById('toastContainer').appendChild(t); setTimeout(() => t.remove(), 3000); }
        
        window.switchTab = function(t) {
            document.getElementById('ventasContainer').classList.toggle('hidden', t !== 'ventas');
            document.getElementById('dashboardContainer').classList.toggle('hidden', t !== 'dashboard');
            if(t === 'dashboard') updateDashboardStats();
        };

        function updateDashboardStats() {
            let pagado = 0, pendiente = 0;
            adhesiones.forEach(a => {
                if(a.estadoPago === 'pagado') pagado += parseInt(a.precio || 0);
                else pendiente += parseInt(a.precio || 0);
            });
            document.getElementById('dash-pagado').textContent = `Gs. ${pagado.toLocaleString()}`;
            document.getElementById('dash-pendiente').textContent = `Gs. ${pendiente.toLocaleString()}`;
        }

        window.toggleEstadoPago = function(id) {
            const idx = adhesiones.findIndex(a => a.id === id);
            if (idx > -1) {
                adhesiones[idx].estadoPago = (adhesiones[idx].estadoPago === 'pagado') ? 'pendiente' : 'pagado';
                renderTable();
                updateDashboardStats();
            }
        };

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            adhesiones.forEach(a => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold">#${a.numero}</td>
                    <td class="px-6 py-4">${a.vendedor}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-bold ${a.estadoPago === 'pagado' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                            ${a.estadoPago.toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <button onclick="toggleEstadoPago('${a.id}')" class="bg-blue-500 text-white px-3 py-1 rounded text-xs font-bold">Cambiar Estado</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('adhesionForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nuevo = {
                id: Date.now().toString(),
                numero: adhesiones.length + 1,
                vendedor: document.getElementById('vendedor').value,
                precio: document.getElementById('precio').value,
                comprador: document.getElementById('comprador').value,
                estadoPago: document.querySelector('input[name="estadoPago"]:checked').value
            };
            adhesiones.push(nuevo);
            renderTable();
            showToast("Registrado");
        });

        // Configuración Admin simplificada
        window.showLoginModal = () => document.getElementById('loginOverlay').classList.remove('hidden');
        window.closeLoginModal = () => document.getElementById('loginOverlay').classList.add('hidden');
        window.checkLogin = () => { if(document.getElementById('adminPassword').value === 'Iramain102$ro$') { document.getElementById('configOverlay').classList.remove('hidden'); closeLoginModal(); } else alert('Error'); };
        window.closeConfigModal = () => document.getElementById('configOverlay').classList.add('hidden');
        window.saveEventConfig = () => { localStorage.setItem('feriaEventConfig', JSON.stringify(eventConfig)); closeConfigModal(); };

    </script>
</body>
</html>
